# Prod profile: Postgres with an explicitly tuned connection pool.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: shopflow
    password: shopflow          # use an env var or secret manager in real deployments
    hikari:
      # Pool size is limited on purpose - each connection costs memory and a
      # backend process on the database.
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 3000  # ms to wait for a free connection before failing
      idle-timeout: 600000      # retire surplus idle connections after 10 min
      max-lifetime: 1800000     # recycle connections after 30 min
      leak-detection-threshold: 60000   # warn if a connection is held over 60s
      pool-name: order-hikari   # shows up in the metrics endpoint
  jpa:
    hibernate:
      ddl-auto: validate        # schema is managed by migrations, not Hibernate
    show-sql: false
