server:
  port: 8083

spring:
  application:
    name: order-service
  profiles:
    # dev = H2 in memory, prod = Postgres. Override with SPRING_PROFILES_ACTIVE.
    default: dev

  data:
    redis:
      host: localhost
      port: 6379

  # Kafka producer and consumer, using JSON serialization.
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Wait for the replicas to confirm before treating a send as successful.
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        # Only deserialize into our own event classes.
        spring.json.trusted.packages: com.shopflow.common.events

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: "change-me-shopflow-demo-secret-key-32b!"   # must match auth-service and gateway

# Actuator endpoints. Exposure is opt-in per endpoint.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,scheduledtasks
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # %X{correlationId} prints the id set by RequestLoggingFilter.
    console: "%d{HH:mm:ss.SSS} [%thread] [%X{correlationId:-}] %-5level %logger{36} - %msg%n"
  level:
    com.shopflow.order: DEBUG
