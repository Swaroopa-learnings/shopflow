# Dev profile: in-memory H2, so no database needs installing.
# Data is lost on restart.
spring:
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the database alive for the life of the JVM.
    # Without it H2 drops it once the last connection closes.
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop   # schema generated from the entities
    show-sql: true
  h2:
    console:
      enabled: true           # http://localhost:8083/h2-console
