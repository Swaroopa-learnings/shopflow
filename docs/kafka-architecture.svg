<svg viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10B981"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#0B1220"/>

  <!-- ============ HEADER ============ -->
  <text x="70" y="62" font-size="34" font-weight="700" fill="#FFFFFF">Event-Driven Communication with Kafka</text>
  <text x="70" y="94" font-size="15" fill="#7C8AA5">Producers publish facts and move on. Consumers read them independently, at their own pace, each group with its own copy of the stream.</text>

  <!-- ============ SCHEMA REGISTRY ============ -->
  <rect x="580" y="120" width="440" height="72" rx="12" fill="#111C30" stroke="#2E4468" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="147" font-size="15" font-weight="700" fill="#94A3B8">Schema Registry <tspan font-weight="400" font-size="12" fill="#7C8AA5">(Avro / Protobuf)</tspan></text>
  <text x="600" y="170" font-size="12" fill="#7C8AA5">Producers and consumers fetch and validate schemas here,</text>
  <text x="600" y="186" font-size="12" fill="#7C8AA5">so fields can be added without breaking older readers.</text>

  <!-- registry -> producers / consumers (NOT to the broker) -->
  <path d="M 574 165 C 480 165 400 195 336 232" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <path d="M 1026 165 C 1110 165 1160 195 1200 232" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="404" y="205" font-size="10.5" fill="#7C8AA5">serialize</text>
  <text x="1032" y="199" font-size="10.5" fill="#7C8AA5">deserialize</text>

  <!-- ============ PRODUCERS ============ -->
  <text x="62" y="234" font-size="13.5" font-weight="700" fill="#94A3B8" letter-spacing="1">PRODUCERS</text>

  <rect x="60" y="248" width="270" height="86" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="80" y="276" font-size="15" font-weight="700" fill="#A5B4FC">Order Service</text>
  <text x="80" y="298" font-size="12" fill="#CBD5E1">Publishes OrderPlaced,</text>
  <text x="80" y="316" font-size="12" fill="#CBD5E1">OrderCancelled</text>

  <rect x="60" y="346" width="270" height="86" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="80" y="374" font-size="15" font-weight="700" fill="#A5B4FC">Payment Service</text>
  <text x="80" y="396" font-size="12" fill="#CBD5E1">Publishes PaymentCompleted,</text>
  <text x="80" y="414" font-size="12" fill="#CBD5E1">PaymentFailed</text>

  <rect x="60" y="444" width="270" height="86" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="80" y="472" font-size="15" font-weight="700" fill="#A5B4FC">Shipping Service</text>
  <text x="80" y="494" font-size="12" fill="#CBD5E1">Publishes ShipmentUpdated,</text>
  <text x="80" y="512" font-size="12" fill="#CBD5E1">ShipmentDelivered</text>

  <text x="80" y="556" font-size="11.5" fill="#7C8AA5">Publish and continue - no waiting</text>
  <text x="80" y="573" font-size="11.5" fill="#7C8AA5">for any consumer to respond.</text>

  <!-- producers -> cluster -->
  <path d="M 330 291 C 380 291 390 380 444 400" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 330 389 C 380 389 400 394 444 400" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <path d="M 330 487 C 380 487 390 420 444 404" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ============ KAFKA CLUSTER ============ -->
  <rect x="450" y="248" width="640" height="354" rx="14" fill="#182742" stroke="#F59E0B" stroke-width="2"/>
  <text x="770" y="282" font-size="19" font-weight="700" fill="#FCD34D" text-anchor="middle">KAFKA CLUSTER</text>
  <text x="770" y="303" font-size="12" fill="#B4915A" text-anchor="middle">A durable, replayable log - events are kept, not consumed away</text>

  <!-- topic box -->
  <rect x="470" y="318" width="600" height="208" rx="10" fill="#0F1A2E" stroke="#2E4468" stroke-width="1.5"/>
  <text x="490" y="345" font-size="15" font-weight="700" fill="#38BDF8">Topic: domain.events</text>
  <text x="490" y="368" font-size="11.5" fill="#7C8AA5">Partition key = orderId, so every event for one order lands in the same partition.</text>

  <!-- partitions -->
  <g font-size="11.5">
    <text x="490" y="400" fill="#CBD5E1">Partition 0</text>
    <rect x="600" y="386" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="621" y="401" fill="#60A5FA" text-anchor="middle">0</text>
    <rect x="648" y="386" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="669" y="401" fill="#60A5FA" text-anchor="middle">1</text>
    <rect x="696" y="386" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="717" y="401" fill="#60A5FA" text-anchor="middle">2</text>
    <rect x="744" y="386" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="765" y="401" fill="#60A5FA" text-anchor="middle">3</text>
    <rect x="792" y="386" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="813" y="401" fill="#60A5FA" text-anchor="middle">4</text>
    <text x="852" y="402" fill="#526079">. . .</text>

    <text x="490" y="434" fill="#CBD5E1">Partition 1</text>
    <rect x="600" y="420" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="621" y="435" fill="#60A5FA" text-anchor="middle">0</text>
    <rect x="648" y="420" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="669" y="435" fill="#60A5FA" text-anchor="middle">1</text>
    <rect x="696" y="420" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="717" y="435" fill="#60A5FA" text-anchor="middle">2</text>
    <rect x="744" y="420" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="765" y="435" fill="#60A5FA" text-anchor="middle">3</text>
    <rect x="792" y="420" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="813" y="435" fill="#60A5FA" text-anchor="middle">4</text>
    <text x="852" y="436" fill="#526079">. . .</text>

    <text x="490" y="468" fill="#CBD5E1">Partition 2</text>
    <rect x="600" y="454" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="621" y="469" fill="#60A5FA" text-anchor="middle">0</text>
    <rect x="648" y="454" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="669" y="469" fill="#60A5FA" text-anchor="middle">1</text>
    <rect x="696" y="454" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="717" y="469" fill="#60A5FA" text-anchor="middle">2</text>
    <rect x="744" y="454" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="765" y="469" fill="#60A5FA" text-anchor="middle">3</text>
    <rect x="792" y="454" width="42" height="22" rx="5" fill="#16233A" stroke="#3B82F6"/><text x="813" y="469" fill="#60A5FA" text-anchor="middle">4</text>
    <text x="852" y="470" fill="#526079">. . .</text>
  </g>

  <text x="490" y="502" font-size="11.5" fill="#FCD34D">Offsets are per partition, each starting at 0 - ordering is guaranteed inside a partition, not across the topic.</text>

  <!-- event shape -->
  <rect x="470" y="540" width="600" height="46" rx="10" fill="#0F1A2E" stroke="#2E4468" stroke-width="1.5"/>
  <text x="490" y="569" font-size="12" fill="#7C8AA5">Event&#160;&#160;<tspan fill="#CBD5E1">key = orderId</tspan>&#160;&#160;|&#160;&#160;<tspan fill="#CBD5E1">headers = eventType, schema id</tspan>&#160;&#160;|&#160;&#160;<tspan fill="#CBD5E1">value = payload</tspan></text>

  <!-- delivery semantics -->
  <rect x="450" y="616" width="640" height="40" rx="10" fill="#2A2008" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="770" y="641" font-size="12.5" fill="#FCD34D" text-anchor="middle">Delivery is at-least-once, so the same event can arrive twice - consumers must be idempotent.</text>

  <!-- cluster -> consumers -->
  <path d="M 1090 330 C 1120 330 1120 290 1144 290" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <path d="M 1090 380 C 1120 380 1120 380 1144 380" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <path d="M 1090 430 C 1120 430 1120 470 1144 470" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <path d="M 1090 480 C 1120 480 1120 560 1144 560" fill="none" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>

  <!-- ============ CONSUMERS ============ -->
  <text x="1152" y="234" font-size="13.5" font-weight="700" fill="#94A3B8" letter-spacing="1">CONSUMER GROUPS</text>

  <rect x="1150" y="248" width="400" height="80" rx="12" fill="#16233A" stroke="#10B981" stroke-width="1.5"/>
  <text x="1170" y="274" font-size="14" font-weight="700" fill="#34D399">inventory-service-group</text>
  <text x="1170" y="296" font-size="11.5" fill="#CBD5E1">Reads OrderPlaced, OrderCancelled</text>
  <text x="1170" y="315" font-size="11" fill="#7C8AA5">3 retries, exponential backoff, then inventory-dlq</text>

  <rect x="1150" y="338" width="400" height="80" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="1170" y="364" font-size="14" font-weight="700" fill="#A5B4FC">notification-service-group</text>
  <text x="1170" y="386" font-size="11.5" fill="#CBD5E1">Reads OrderPlaced, PaymentCompleted</text>
  <text x="1170" y="405" font-size="11" fill="#7C8AA5">5 retries, fixed backoff, then notification-dlq</text>

  <rect x="1150" y="428" width="400" height="80" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="1170" y="454" font-size="14" font-weight="700" fill="#A5B4FC">analytics-service-group</text>
  <text x="1170" y="476" font-size="11.5" fill="#CBD5E1">Reads every event type</text>
  <text x="1170" y="495" font-size="11" fill="#7C8AA5">3 retries, exponential backoff, then analytics-dlq</text>

  <rect x="1150" y="518" width="400" height="80" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="1170" y="544" font-size="14" font-weight="700" fill="#A5B4FC">search-service-group</text>
  <text x="1170" y="566" font-size="11.5" fill="#CBD5E1">Reads OrderPlaced, ShipmentUpdated</text>
  <text x="1170" y="585" font-size="11" fill="#7C8AA5">added months later - no producer changed</text>

  <text x="1152" y="628" font-size="11.5" fill="#7C8AA5">Every group keeps its own offset, so all four read</text>
  <text x="1152" y="645" font-size="11.5" fill="#7C8AA5">the same events without affecting each other.</text>

  <!-- ============ BOTTOM LEFT: PARALLELISM ============ -->
  <rect x="60" y="686" width="780" height="240" rx="14" fill="#111C30" stroke="#2E4468" stroke-width="1.5"/>
  <text x="82" y="716" font-size="16" font-weight="700" fill="#FFFFFF">Partitions are the unit of parallelism</text>
  <text x="82" y="738" font-size="12" fill="#7C8AA5">Within one group, each partition is handled by exactly one consumer instance.</text>

  <text x="112" y="774" font-size="11.5" fill="#38BDF8">domain.events</text>
  <rect x="100" y="786" width="110" height="28" rx="6" fill="#16233A" stroke="#3B82F6"/><text x="155" y="805" font-size="11.5" fill="#60A5FA" text-anchor="middle">Partition 0</text>
  <rect x="100" y="822" width="110" height="28" rx="6" fill="#16233A" stroke="#3B82F6"/><text x="155" y="841" font-size="11.5" fill="#60A5FA" text-anchor="middle">Partition 1</text>
  <rect x="100" y="858" width="110" height="28" rx="6" fill="#16233A" stroke="#3B82F6"/><text x="155" y="877" font-size="11.5" fill="#60A5FA" text-anchor="middle">Partition 2</text>

  <line x1="212" y1="800" x2="316" y2="800" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <line x1="212" y1="836" x2="316" y2="836" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <line x1="212" y1="872" x2="316" y2="872" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>

  <text x="324" y="774" font-size="11.5" fill="#34D399">inventory-service-group</text>
  <rect x="322" y="786" width="130" height="28" rx="6" fill="#16233A" stroke="#10B981"/><text x="387" y="805" font-size="11.5" fill="#CBD5E1" text-anchor="middle">consumer 1</text>
  <rect x="322" y="822" width="130" height="28" rx="6" fill="#16233A" stroke="#10B981"/><text x="387" y="841" font-size="11.5" fill="#CBD5E1" text-anchor="middle">consumer 2</text>
  <rect x="322" y="858" width="130" height="28" rx="6" fill="#16233A" stroke="#10B981"/><text x="387" y="877" font-size="11.5" fill="#CBD5E1" text-anchor="middle">consumer 3</text>

  <rect x="322" y="894" width="130" height="24" rx="6" fill="#1F1214" stroke="#EF4444" stroke-dasharray="4 3"/>
  <text x="387" y="911" font-size="10.5" fill="#F87171" text-anchor="middle">consumer 4 - idle</text>

  <text x="480" y="792" font-size="12" fill="#CBD5E1">Three partitions, so at most three consumers</text>
  <text x="480" y="810" font-size="12" fill="#CBD5E1">in this group do work. A fourth gets nothing.</text>
  <text x="480" y="838" font-size="12" fill="#CBD5E1">To scale further, add partitions - but only</text>
  <text x="480" y="856" font-size="12" fill="#CBD5E1">as many as the ordering guarantee allows.</text>
  <text x="480" y="886" font-size="12" fill="#7C8AA5">Other groups read the same partitions in</text>
  <text x="480" y="904" font-size="12" fill="#7C8AA5">parallel, entirely unaffected by this one.</text>

  <!-- ============ BOTTOM MIDDLE: WHY IT HOLDS UP ============ -->
  <rect x="860" y="686" width="430" height="240" rx="14" fill="#111C30" stroke="#2E4468" stroke-width="1.5"/>
  <text x="882" y="716" font-size="16" font-weight="700" fill="#FFFFFF">What this buys you</text>

  <g font-size="12">
    <text x="882" y="746" fill="#CBD5E1">— Producers never wait on consumers, so a slow</text>
    <text x="897" y="763" fill="#7C8AA5">or failed reader can't stall the write path.</text>

    <text x="882" y="791" fill="#CBD5E1">— Events are retained, so a new consumer can</text>
    <text x="897" y="808" fill="#7C8AA5">replay history and backfill its own store.</text>

    <text x="882" y="836" fill="#CBD5E1">— Failures are isolated per group: retries and a</text>
    <text x="897" y="853" fill="#7C8AA5">dead-letter topic, without blocking anyone else.</text>

    <text x="882" y="881" fill="#CBD5E1">— New consumers subscribe without any change</text>
    <text x="897" y="898" fill="#7C8AA5">to the services producing the events.</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <rect x="1310" y="686" width="240" height="240" rx="14" fill="#111C30" stroke="#2E4468" stroke-width="1.5"/>
  <text x="1332" y="716" font-size="15" font-weight="700" fill="#FFFFFF">Legend</text>

  <line x1="1332" y1="744" x2="1382" y2="744" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="1392" y="748" font-size="11.5" fill="#CBD5E1">publish</text>

  <line x1="1332" y1="776" x2="1382" y2="776" stroke="#10B981" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowGreen)"/>
  <text x="1392" y="780" font-size="11.5" fill="#CBD5E1">consume</text>

  <line x1="1332" y1="808" x2="1382" y2="808" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="1392" y="812" font-size="11.5" fill="#CBD5E1">schema lookup</text>

  <rect x="1332" y="832" width="34" height="18" rx="5" fill="#16233A" stroke="#3B82F6"/>
  <text x="1392" y="846" font-size="11.5" fill="#CBD5E1">partition</text>

  <rect x="1332" y="862" width="34" height="18" rx="5" fill="#16233A" stroke="#10B981"/>
  <text x="1392" y="876" font-size="11.5" fill="#CBD5E1">consumer group</text>

  <rect x="1332" y="892" width="34" height="18" rx="5" fill="#1F1214" stroke="#EF4444"/>
  <text x="1392" y="906" font-size="11.5" fill="#CBD5E1">idle / dead letter</text>

  <!-- footer -->
  <text x="70" y="968" font-size="12.5" fill="#526079">One topic, many independent readers. The broker keeps the log; each consumer group keeps only its own position in it.</text>
</svg>
