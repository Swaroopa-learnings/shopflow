<svg viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="1600" height="1000" fill="#0B1220"/>

  <!-- ============ HEADER ============ -->
  <text x="70" y="66" font-size="38" font-weight="700" fill="#FFFFFF">ShopFlow<tspan fill="#94A3B8" font-weight="400" font-size="30">  ·  Spring Boot Microservices Backend</tspan></text>
  <text x="70" y="100" font-size="15" fill="#7C8AA5">Spring Cloud Gateway · Eureka · Apache Kafka · Redis · PostgreSQL · MongoDB · Resilience4j · JWT&#160;&#160;&#160;—&#160;&#160;&#160;CQRS · Event Sourcing · Saga Pattern · Idempotency · Circuit Breaker</text>

  <!-- ============ CLIENT ============ -->
  <rect x="60" y="330" width="130" height="64" rx="12" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="125" y="358" font-size="17" font-weight="600" fill="#E2E8F0" text-anchor="middle">Client</text>
  <text x="125" y="378" font-size="12" fill="#7C8AA5" text-anchor="middle">web / mobile</text>

  <!-- client -> gateway -->
  <line x1="190" y1="362" x2="244" y2="362" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="217" cy="345" r="11" fill="#F59E0B"/><text x="217" y="350" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">1</text>

  <!-- ============ API GATEWAY ============ -->
  <rect x="250" y="260" width="240" height="200" rx="14" fill="#16233A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="270" y="292" font-size="18" font-weight="700" fill="#38BDF8">API Gateway <tspan fill="#7C8AA5" font-weight="400" font-size="13">:8080</tspan></text>
  <text x="270" y="318" font-size="13" fill="#CBD5E1">Spring Cloud Gateway</text>
  <text x="270" y="340" font-size="13" fill="#CBD5E1">JWT verified at the edge</text>
  <text x="270" y="362" font-size="13" fill="#CBD5E1">Rate limiting (token bucket)</text>
  <text x="270" y="384" font-size="13" fill="#CBD5E1">Routes via Eureka (lb://)</text>
  <circle cx="475" cy="275" r="11" fill="#F59E0B"/><text x="475" y="280" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>
  <rect x="270" y="404" width="52" height="20" rx="10" fill="#1F1214" stroke="#EF4444"/><text x="296" y="418" font-size="10.5" fill="#F87171" text-anchor="middle">Redis</text>

  <!-- gateway -> auth -->
  <path d="M 490 300 C 545 300 545 190 594 190" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="522" y="248" font-size="11.5" fill="#7C8AA5">/auth</text>
  <!-- gateway -> product -->
  <path d="M 490 340 C 545 340 545 325 594 325" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="516" y="322" font-size="11.5" fill="#7C8AA5">/products</text>
  <!-- gateway -> order -->
  <path d="M 490 420 C 545 420 545 520 594 520" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="520" y="480" font-size="11.5" fill="#7C8AA5">/orders</text>

  <!-- ============ AUTH SERVICE ============ -->
  <rect x="600" y="140" width="250" height="100" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="620" y="170" font-size="17" font-weight="700" fill="#A5B4FC">auth-service <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8081</tspan></text>
  <text x="620" y="193" font-size="12.5" fill="#CBD5E1">Issues JWTs · Spring Security 6 · BCrypt</text>
  <rect x="620" y="206" width="78" height="20" rx="10" fill="#101B2E" stroke="#3B82F6"/><text x="659" y="220" font-size="10.5" fill="#60A5FA" text-anchor="middle">PostgreSQL</text>

  <!-- ============ PRODUCT SERVICE ============ -->
  <rect x="600" y="270" width="250" height="110" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="620" y="300" font-size="17" font-weight="700" fill="#A5B4FC">product-service <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8082</tspan></text>
  <text x="620" y="323" font-size="12.5" fill="#CBD5E1">Catalog API v1 + v2 · @Cacheable</text>
  <rect x="620" y="338" width="72" height="20" rx="10" fill="#0E1F1A" stroke="#10B981"/><text x="656" y="352" font-size="10.5" fill="#34D399" text-anchor="middle">MongoDB</text>
  <rect x="700" y="338" width="86" height="20" rx="10" fill="#1F1214" stroke="#EF4444"/><text x="743" y="352" font-size="10.5" fill="#F87171" text-anchor="middle">Redis cache</text>

  <!-- order -> product sync call -->
  <line x1="750" y1="424" x2="750" y2="386" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <circle cx="774" cy="405" r="11" fill="#F59E0B"/><text x="774" y="410" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">4</text>
  <text x="794" y="410" font-size="11.5" fill="#7C8AA5">Feign (sync)</text>

  <!-- ============ ORDER SERVICE ============ -->
  <rect x="600" y="430" width="300" height="210" rx="14" fill="#182742" stroke="#818CF8" stroke-width="2"/>
  <text x="620" y="462" font-size="18" font-weight="700" fill="#C7D2FE">order-service <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8083</tspan></text>
  <circle cx="875" cy="455" r="11" fill="#F59E0B"/><text x="875" y="460" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">3</text>
  <text x="620" y="490" font-size="13" fill="#E2E8F0">Validation + Idempotency-Key replay</text>
  <text x="620" y="513" font-size="13" fill="#E2E8F0">CQRS — command / query models</text>
  <text x="620" y="536" font-size="13" fill="#E2E8F0">Event sourcing — append-only store</text>
  <text x="620" y="559" font-size="13" fill="#E2E8F0">Saga orchestrator (compensations)</text>
  <text x="620" y="582" font-size="13" fill="#E2E8F0">Scheduled saga-timeout sweep</text>
  <rect x="620" y="598" width="78" height="20" rx="10" fill="#101B2E" stroke="#3B82F6"/><text x="659" y="612" font-size="10.5" fill="#60A5FA" text-anchor="middle">PostgreSQL</text>
  <rect x="706" y="598" width="52" height="20" rx="10" fill="#1F1214" stroke="#EF4444"/><text x="732" y="612" font-size="10.5" fill="#F87171" text-anchor="middle">Redis</text>

  <!-- order -> kafka -->
  <line x1="750" y1="640" x2="750" y2="694" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <circle cx="727" cy="668" r="11" fill="#F59E0B"/><text x="727" y="673" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">5</text>
  <text x="768" y="672" font-size="11.5" fill="#B4915A">events + commands</text>

  <!-- ============ EUREKA ============ -->
  <rect x="60" y="700" width="230" height="90" rx="14" fill="#111C30" stroke="#2E4468" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="80" y="730" font-size="16" font-weight="700" fill="#94A3B8">Eureka <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8761</tspan></text>
  <text x="80" y="753" font-size="12" fill="#7C8AA5">Service discovery — every service</text>
  <text x="80" y="771" font-size="12" fill="#7C8AA5">registers; callers resolve by name</text>

  <!-- ============ KAFKA BUS ============ -->
  <rect x="340" y="700" width="880" height="56" rx="12" fill="#2A2008" stroke="#F59E0B" stroke-width="2"/>
  <text x="780" y="724" font-size="16" font-weight="700" fill="#FCD34D" text-anchor="middle">Apache Kafka  —  async event backbone (KRaft)</text>
  <text x="780" y="744" font-size="11.5" fill="#B4915A" text-anchor="middle">order.events · inventory.commands / events · payment.commands / events</text>

  <!-- kafka <-> inventory -->
  <line x1="455" y1="756" x2="455" y2="794" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="485" y1="794" x2="485" y2="758" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle cx="425" cy="775" r="11" fill="#F59E0B"/><text x="425" y="780" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">6</text>

  <!-- kafka <-> payment -->
  <line x1="765" y1="756" x2="765" y2="794" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="795" y1="794" x2="795" y2="758" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle cx="735" cy="775" r="11" fill="#F59E0B"/><text x="735" y="780" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">7</text>
  <circle cx="825" cy="775" r="11" fill="#F59E0B"/><text x="825" y="780" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">8</text>

  <!-- kafka -> notification -->
  <line x1="1090" y1="756" x2="1090" y2="794" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle cx="1114" cy="775" r="11" fill="#F59E0B"/><text x="1114" y="780" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">9</text>

  <!-- ============ INVENTORY ============ -->
  <rect x="340" y="800" width="260" height="120" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="360" y="830" font-size="16" font-weight="700" fill="#A5B4FC">inventory-service <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8084</tspan></text>
  <text x="360" y="853" font-size="12.5" fill="#CBD5E1">Reserve / release stock (compensation)</text>
  <text x="360" y="873" font-size="12.5" fill="#CBD5E1">Idempotent consumer · optimistic locks</text>
  <rect x="360" y="886" width="78" height="20" rx="10" fill="#101B2E" stroke="#3B82F6"/><text x="399" y="900" font-size="10.5" fill="#60A5FA" text-anchor="middle">PostgreSQL</text>

  <!-- ============ PAYMENT ============ -->
  <rect x="650" y="800" width="260" height="120" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="670" y="830" font-size="16" font-weight="700" fill="#A5B4FC">payment-service <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8085</tspan></text>
  <text x="670" y="853" font-size="12.5" fill="#CBD5E1">Circuit breaker + retry (Resilience4j)</text>
  <text x="670" y="873" font-size="12.5" fill="#CBD5E1">Flaky mock bank · fallback feeds saga</text>
  <rect x="670" y="886" width="78" height="20" rx="10" fill="#101B2E" stroke="#3B82F6"/><text x="709" y="900" font-size="10.5" fill="#60A5FA" text-anchor="middle">PostgreSQL</text>

  <!-- ============ NOTIFICATION ============ -->
  <rect x="960" y="800" width="260" height="120" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="980" y="830" font-size="16" font-weight="700" fill="#A5B4FC">notification-service <tspan fill="#7C8AA5" font-weight="400" font-size="12">:8086</tspan></text>
  <text x="980" y="853" font-size="12.5" fill="#CBD5E1">@Async email / SMS on thread pool</text>
  <text x="980" y="873" font-size="12.5" fill="#CBD5E1">@Qualifier sender strategies</text>
  <text x="980" y="900" font-size="11" fill="#7C8AA5">consumes order.events — zero producer changes</text>

  <!-- ============ RIGHT PANEL: REQUEST FLOW ============ -->
  <rect x="1255" y="140" width="305" height="640" rx="16" fill="#111C30" stroke="#2E4468" stroke-width="1.5"/>
  <text x="1280" y="178" font-size="17" font-weight="700" fill="#FFFFFF">Placing an order — the flow</text>

  <g font-size="12.5">
    <circle cx="1291" cy="212" r="11" fill="#F59E0B"/><text x="1291" y="217" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">1</text>
    <text x="1312" y="209" fill="#E2E8F0">POST /orders with JWT and an</text>
    <text x="1312" y="226" fill="#7C8AA5">Idempotency-Key (retry-safe)</text>

    <circle cx="1291" cy="264" r="11" fill="#F59E0B"/><text x="1291" y="269" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>
    <text x="1312" y="261" fill="#E2E8F0">Gateway verifies JWT, applies</text>
    <text x="1312" y="278" fill="#7C8AA5">per-user rate limit (Redis)</text>

    <circle cx="1291" cy="316" r="11" fill="#F59E0B"/><text x="1291" y="321" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">3</text>
    <text x="1312" y="313" fill="#E2E8F0">Bean Validation + duplicate</text>
    <text x="1312" y="330" fill="#7C8AA5">requests replayed from Redis</text>

    <circle cx="1291" cy="368" r="11" fill="#F59E0B"/><text x="1291" y="373" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">4</text>
    <text x="1312" y="365" fill="#E2E8F0">Sync price lookup via Feign,</text>
    <text x="1312" y="382" fill="#7C8AA5">resolved through Eureka</text>

    <circle cx="1291" cy="420" r="11" fill="#F59E0B"/><text x="1291" y="425" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">5</text>
    <text x="1312" y="417" fill="#E2E8F0">OrderCreated appended to event</text>
    <text x="1312" y="434" fill="#7C8AA5">store + streamed to Kafka</text>

    <circle cx="1291" cy="472" r="11" fill="#F59E0B"/><text x="1291" y="477" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">6</text>
    <text x="1312" y="469" fill="#E2E8F0">Saga step 1: inventory reserves</text>
    <text x="1312" y="486" fill="#7C8AA5">stock — or rejects the order</text>

    <circle cx="1291" cy="524" r="11" fill="#F59E0B"/><text x="1291" y="529" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">7</text>
    <text x="1312" y="521" fill="#E2E8F0">Saga step 2: payment charged</text>
    <text x="1312" y="538" fill="#7C8AA5">behind a circuit breaker</text>

    <circle cx="1291" cy="576" r="11" fill="#F59E0B"/><text x="1291" y="581" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">8</text>
    <text x="1312" y="573" fill="#E2E8F0">COMPLETED — or compensate:</text>
    <text x="1312" y="590" fill="#7C8AA5">release stock, cancel order</text>

    <circle cx="1291" cy="628" r="11" fill="#F59E0B"/><text x="1291" y="633" font-size="12" font-weight="700" fill="#0B1220" text-anchor="middle">9</text>
    <text x="1312" y="625" fill="#E2E8F0">Notifications fan out async</text>
    <text x="1312" y="642" fill="#7C8AA5">(email + SMS on cancellation)</text>
  </g>

  <line x1="1280" y1="668" x2="1535" y2="668" stroke="#2E4468" stroke-width="1"/>
  <text x="1280" y="698" font-size="12.5" fill="#94A3B8">9 Spring Boot services · 5 Kafka topics</text>
  <text x="1280" y="718" font-size="12.5" fill="#94A3B8">Client reads eventual outcome from</text>
  <text x="1280" y="736" font-size="12.5" fill="#94A3B8">the CQRS read model (202 → poll)</text>
  <text x="1280" y="762" font-size="12.5" fill="#64748B">Istio mesh manifests included (docs)</text>

  <!-- footer -->
  <text x="70" y="972" font-size="13" fill="#526079">ShopFlow — Java 21 · Spring Boot 3.3 · Spring Cloud 2023 · Kafka · Redis · PostgreSQL · MongoDB</text>
</svg>
