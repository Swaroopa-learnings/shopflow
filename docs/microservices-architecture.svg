<svg viewBox="0 0 1600 1000" width="1600" height="1000" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748B"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <!-- database cylinders (SQL = blue, NoSQL = green), drawn once, reused via <use> -->
    <g id="dbcyl">
      <path d="M 0 8 L 0 42 A 50 10 0 0 0 100 42 L 100 8" fill="#101B2E" stroke="#3B82F6" stroke-width="1.5"/>
      <ellipse cx="50" cy="8" rx="50" ry="10" fill="#16233A" stroke="#3B82F6" stroke-width="1.5"/>
    </g>
    <g id="dbcylNoSql">
      <path d="M 0 8 L 0 42 A 50 10 0 0 0 100 42 L 100 8" fill="#0E1F1A" stroke="#10B981" stroke-width="1.5"/>
      <ellipse cx="50" cy="8" rx="50" ry="10" fill="#14261F" stroke="#10B981" stroke-width="1.5"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="#0B1220"/>

  <!-- ============ HEADER ============ -->
  <text x="70" y="66" font-size="36" font-weight="700" fill="#FFFFFF">Microservices Architecture<tspan fill="#94A3B8" font-weight="400" font-size="28">  ·  how a request really flows</tspan></text>
  <text x="70" y="100" font-size="15" fill="#7C8AA5">One design that fits ANY business — e-commerce, banking, logistics — only the box labels change. Gateway at the edge · sync + async communication · a private database per service · supporting cache.</text>

  <!-- ============ IDENTITY PROVIDER ============ -->
  <rect x="270" y="150" width="230" height="100" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="290" y="180" font-size="16" font-weight="700" fill="#A5B4FC">Identity Provider</text>
  <text x="290" y="204" font-size="12.5" fill="#CBD5E1">Issues signed tokens (OIDC / JWT)</text>
  <text x="290" y="224" font-size="12.5" fill="#CBD5E1">Roles &amp; claims embedded in token</text>
  <circle cx="483" cy="167" r="11" fill="#F59E0B"/><text x="483" y="172" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">1</text>

  <!-- ============ CLIENTS ============ -->
  <rect x="60" y="330" width="150" height="140" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="135" y="362" font-size="17" font-weight="700" fill="#E2E8F0" text-anchor="middle">Clients</text>
  <text x="135" y="390" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Web / mobile</text>
  <text x="135" y="410" font-size="12.5" fill="#CBD5E1" text-anchor="middle">Other systems</text>
  <text x="135" y="438" font-size="11" fill="#7C8AA5" text-anchor="middle">token attached to</text>
  <text x="135" y="454" font-size="11" fill="#7C8AA5" text-anchor="middle">every request</text>

  <!-- client -> identity (dashed) -->
  <path d="M 160 330 C 180 260 220 215 264 203" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="150" y="270" font-size="11" fill="#7C8AA5">authenticate</text>

  <!-- client -> gateway -->
  <line x1="210" y1="400" x2="264" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- ============ API GATEWAY ============ -->
  <rect x="270" y="310" width="230" height="190" rx="14" fill="#16233A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="290" y="342" font-size="18" font-weight="700" fill="#38BDF8">API Gateway</text>
  <text x="290" y="370" font-size="13" fill="#CBD5E1">Verifies the token (authN)</text>
  <text x="290" y="392" font-size="13" fill="#CBD5E1">Rate limiting &amp; quotas</text>
  <text x="290" y="414" font-size="13" fill="#CBD5E1">Routes to services by name</text>
  <text x="290" y="436" font-size="13" fill="#CBD5E1">TLS · logging · CORS — once</text>
  <text x="290" y="474" font-size="11.5" fill="#7C8AA5">the ONLY publicly reachable</text>
  <text x="290" y="490" font-size="11.5" fill="#7C8AA5">component</text>
  <circle cx="483" cy="327" r="11" fill="#F59E0B"/><text x="483" y="332" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>

  <!-- ============ REGISTRY + CONFIG ============ -->
  <rect x="580" y="150" width="300" height="100" rx="14" fill="#111C30" stroke="#2E4468" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="600" y="180" font-size="15" font-weight="700" fill="#94A3B8">Service Registry &amp; Config</text>
  <text x="600" y="204" font-size="12" fill="#7C8AA5">Instances resolved by name, not IP</text>
  <text x="600" y="223" font-size="12" fill="#7C8AA5">Same build, per-environment config</text>
  <circle cx="863" cy="167" r="11" fill="#F59E0B"/><text x="863" y="172" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">3</text>

  <!-- gateway -> registry (dashed lookup) -->
  <path d="M 460 310 C 500 265 530 235 574 213" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="470" y="262" font-size="11" fill="#7C8AA5">resolve</text>
  <!-- service A -> registry (dashed register) -->
  <line x1="700" y1="304" x2="700" y2="256" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="712" y="284" font-size="11" fill="#7C8AA5">register + heartbeat</text>

  <!-- gateway -> service A -->
  <line x1="500" y1="400" x2="574" y2="400" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="537" y="387" font-size="11" fill="#7C8AA5" text-anchor="middle">sync</text>
  <text x="537" y="419" font-size="11" fill="#7C8AA5" text-anchor="middle">REST</text>

  <!-- ============ MICROSERVICE A ============ -->
  <rect x="580" y="310" width="270" height="170" rx="14" fill="#182742" stroke="#818CF8" stroke-width="2"/>
  <text x="600" y="340" font-size="17" font-weight="700" fill="#C7D2FE">Microservice A <tspan fill="#7C8AA5" font-weight="400" font-size="12">— owns the use-case</tspan></text>
  <text x="600" y="368" font-size="13" fill="#E2E8F0">Validates &amp; authorizes the request</text>
  <text x="600" y="390" font-size="13" fill="#E2E8F0">One LOCAL ACID transaction</text>
  <text x="600" y="412" font-size="13" fill="#E2E8F0">Queries peers sync when it must</text>
  <text x="600" y="434" font-size="13" fill="#E2E8F0">Publishes a domain event, responds</text>
  <circle cx="833" cy="327" r="11" fill="#F59E0B"/><text x="833" y="332" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">4</text>

  <!-- A's database -->
  <use href="#dbcyl" x="615" y="505"/>
  <text x="665" y="540" font-size="11.5" font-weight="600" fill="#60A5FA" text-anchor="middle">DB of A</text>
  <line x1="665" y1="480" x2="665" y2="503" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="678" y="497" font-size="10.5" fill="#526079">only A reads/writes it</text>

  <!-- ============ MICROSERVICE D (sync peer) ============ -->
  <rect x="950" y="310" width="250" height="170" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="970" y="340" font-size="16" font-weight="700" fill="#A5B4FC">Microservice D <tspan fill="#7C8AA5" font-weight="400" font-size="12">— owns its own domain</tspan></text>
  <text x="970" y="374" font-size="12.5" fill="#CBD5E1">Serves data it owns over a REST API</text>
  <text x="970" y="404" font-size="12.5" fill="#CBD5E1">Found by name via the registry</text>
  <text x="970" y="434" font-size="12.5" fill="#CBD5E1">Timeout + circuit breaker on the call</text>

  <!-- D's database -->
  <use href="#dbcyl" x="985" y="505"/>
  <text x="1035" y="540" font-size="11.5" font-weight="600" fill="#60A5FA" text-anchor="middle">DB of D</text>
  <line x1="1035" y1="480" x2="1035" y2="503" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- A -> D sync call -->
  <line x1="850" y1="380" x2="944" y2="380" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="897" y="352" font-size="10.5" fill="#7C8AA5" text-anchor="middle">sync query</text>
  <text x="897" y="367" font-size="10.5" fill="#7C8AA5" text-anchor="middle">Feign client /</text>
  <text x="897" y="399" font-size="10.5" fill="#7C8AA5" text-anchor="middle">RestTemplate</text>

  <!-- ============ REDIS / CACHE ============ -->
  <rect x="270" y="545" width="230" height="120" rx="14" fill="#1F1214" stroke="#EF4444" stroke-width="1.5"/>
  <text x="290" y="575" font-size="15" font-weight="700" fill="#F87171">Distributed Cache — Redis</text>
  <text x="290" y="599" font-size="12" fill="#CBD5E1">Hot reads (cache-aside pattern)</text>
  <text x="290" y="619" font-size="12" fill="#CBD5E1">Rate-limit counters · idempotency keys</text>
  <text x="290" y="645" font-size="11" fill="#7C8AA5">supporting infrastructure —</text>
  <text x="290" y="660" font-size="11" fill="#7C8AA5">never the system of record</text>
  <!-- gateway uses redis -->
  <line x1="350" y1="500" x2="350" y2="539" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="362" y="525" font-size="10.5" fill="#7C8AA5">rate limits</text>
  <!-- A uses redis -->
  <path d="M 500 580 C 545 570 560 520 578 475" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowDash)"/>
  <text x="500" y="540" font-size="10.5" fill="#7C8AA5">cache /</text>
  <text x="500" y="554" font-size="10.5" fill="#7C8AA5">idempotency</text>

  <!-- A -> broker -->
  <line x1="790" y1="480" x2="790" y2="584" stroke="#F59E0B" stroke-width="2.5" marker-end="url(#arrowAmber)"/>
  <circle cx="767" cy="532" r="11" fill="#F59E0B"/><text x="767" y="537" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">5</text>
  <text x="806" y="536" font-size="11.5" fill="#B4915A">domain event (async)</text>

  <!-- ============ MESSAGE BROKER ============ -->
  <rect x="580" y="590" width="620" height="58" rx="12" fill="#2A2008" stroke="#F59E0B" stroke-width="2"/>
  <text x="890" y="615" font-size="16" font-weight="700" fill="#FCD34D" text-anchor="middle">Message Broker  —  Kafka / RabbitMQ / cloud equivalent</text>
  <text x="890" y="636" font-size="11.5" fill="#B4915A" text-anchor="middle">events &amp; commands · pub/sub fan-out · durable, replayable, ordered per key</text>

  <!-- broker -> B -->
  <line x1="700" y1="648" x2="700" y2="694" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <circle cx="676" cy="672" r="11" fill="#F59E0B"/><text x="676" y="677" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">6</text>
  <!-- broker -> C -->
  <line x1="1040" y1="648" x2="1040" y2="694" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- ============ MICROSERVICE B ============ -->
  <rect x="580" y="700" width="280" height="132" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="600" y="730" font-size="16" font-weight="700" fill="#A5B4FC">Microservice B <tspan fill="#7C8AA5" font-weight="400" font-size="12">— event consumer</tspan></text>
  <text x="600" y="756" font-size="12.5" fill="#CBD5E1">Reacts to A's events with follow-up</text>
  <text x="600" y="776" font-size="12.5" fill="#CBD5E1">work — e.g. sending notifications</text>
  <text x="600" y="800" font-size="12.5" fill="#CBD5E1">If B is down, events queue up;</text>
  <text x="600" y="820" font-size="12.5" fill="#CBD5E1">it catches up later — nothing is lost</text>

  <!-- B's database -->
  <use href="#dbcyl" x="615" y="850"/>
  <text x="665" y="885" font-size="11.5" font-weight="600" fill="#60A5FA" text-anchor="middle">DB of B</text>
  <line x1="665" y1="832" x2="665" y2="848" stroke="#3B82F6" stroke-width="1.5"/>

  <!-- ============ MICROSERVICE C ============ -->
  <rect x="920" y="700" width="280" height="132" rx="14" fill="#16233A" stroke="#2E4468" stroke-width="1.5"/>
  <text x="940" y="730" font-size="16" font-weight="700" fill="#A5B4FC">Microservice C <tspan fill="#7C8AA5" font-weight="400" font-size="12">— added later</tspan></text>
  <text x="940" y="756" font-size="12.5" fill="#CBD5E1">A NEW capability shipped months later</text>
  <text x="940" y="776" font-size="12.5" fill="#CBD5E1">(analytics dashboard, audit trail...)</text>
  <text x="940" y="800" font-size="12.5" fill="#CBD5E1">Reads the SAME event stream —</text>
  <text x="940" y="820" font-size="12.5" fill="#CBD5E1">zero code changes in A or B</text>

  <!-- C's database: NoSQL - read models & analytics are query-shaped, not relational -->
  <use href="#dbcylNoSql" x="955" y="850"/>
  <text x="1005" y="885" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">NoSQL DB of C</text>
  <line x1="1005" y1="832" x2="1005" y2="848" stroke="#10B981" stroke-width="1.5"/>
  <text x="1005" y="928" font-size="10.5" fill="#526079" text-anchor="middle">each service picks its own store — SQL or NoSQL, whatever fits its data</text>

  <!-- never-shared marker between B's and C's DBs -->
  <line x1="723" y1="878" x2="800" y2="878" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="875" y1="878" x2="948" y2="878" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="838" y="882" font-size="12" font-weight="700" fill="#F87171" text-anchor="middle">✕ never shared</text>

  <!-- ============ OBSERVABILITY ============ -->
  <rect x="60" y="700" width="440" height="132" rx="14" fill="#111C30" stroke="#2E4468" stroke-width="1.5"/>
  <text x="80" y="730" font-size="16" font-weight="700" fill="#94A3B8">Observability &amp; Operations</text>
  <text x="80" y="756" font-size="12.5" fill="#7C8AA5">Correlated logs · metrics · distributed traces — one</text>
  <text x="80" y="776" font-size="12.5" fill="#7C8AA5">request id follows the call across every service</text>
  <text x="80" y="800" font-size="12.5" fill="#7C8AA5">Health checks drive orchestration · CI/CD per service</text>
  <text x="80" y="822" font-size="11" fill="#526079">telemetry flows in from every component on this diagram</text>
  <circle cx="473" cy="717" r="11" fill="#F59E0B"/><text x="473" y="722" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">8</text>

  <!-- ============ RESILIENCE NOTE ============ -->
  <circle cx="72" cy="878" r="11" fill="#F59E0B"/><text x="72" y="883" font-size="13" font-weight="700" fill="#0B1220" text-anchor="middle">7</text>
  <text x="94" y="874" font-size="12.5" fill="#94A3B8">Failure is normal — retries + circuit breakers on sync calls,</text>
  <text x="94" y="894" font-size="12.5" fill="#94A3B8">idempotent consumers + dead-letter queues on async, sagas compensate</text>

  <!-- ============ RIGHT PANEL ============ -->
  <rect x="1255" y="140" width="305" height="702" rx="16" fill="#111C30" stroke="#2E4468" stroke-width="1.5"/>
  <text x="1280" y="176" font-size="16" font-weight="700" fill="#FFFFFF">One request, step by step</text>

  <g font-size="12.5">
    <circle cx="1291" cy="208" r="10" fill="#F59E0B"/><text x="1291" y="213" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">1</text>
    <text x="1310" y="205" fill="#E2E8F0">Client authenticates once,</text>
    <text x="1310" y="222" fill="#7C8AA5">receives a signed token</text>

    <circle cx="1291" cy="256" r="10" fill="#F59E0B"/><text x="1291" y="261" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">2</text>
    <text x="1310" y="253" fill="#E2E8F0">Gateway verifies token, applies</text>
    <text x="1310" y="270" fill="#7C8AA5">rate limits, picks the route</text>

    <circle cx="1291" cy="304" r="10" fill="#F59E0B"/><text x="1291" y="309" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">3</text>
    <text x="1310" y="301" fill="#E2E8F0">Target instance found via the</text>
    <text x="1310" y="318" fill="#7C8AA5">registry — services move freely</text>

    <circle cx="1291" cy="352" r="10" fill="#F59E0B"/><text x="1291" y="357" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">4</text>
    <text x="1310" y="349" fill="#E2E8F0">A runs one local ACID transaction;</text>
    <text x="1310" y="366" fill="#7C8AA5">asks D for data it needs (Feign/REST)</text>

    <circle cx="1291" cy="400" r="10" fill="#F59E0B"/><text x="1291" y="405" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">5</text>
    <text x="1310" y="397" fill="#E2E8F0">It publishes a domain event and</text>
    <text x="1310" y="414" fill="#7C8AA5">responds — no waiting on others</text>

    <circle cx="1291" cy="448" r="10" fill="#F59E0B"/><text x="1291" y="453" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">6</text>
    <text x="1310" y="445" fill="#E2E8F0">B and C consume independently,</text>
    <text x="1310" y="462" fill="#7C8AA5">each updating its own database</text>

    <circle cx="1291" cy="496" r="10" fill="#F59E0B"/><text x="1291" y="501" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">7</text>
    <text x="1310" y="493" fill="#E2E8F0">Failures: retry, break the circuit,</text>
    <text x="1310" y="510" fill="#7C8AA5">dead-letter, or compensate (saga)</text>

    <circle cx="1291" cy="544" r="10" fill="#F59E0B"/><text x="1291" y="549" font-size="11.5" font-weight="700" fill="#0B1220" text-anchor="middle">8</text>
    <text x="1310" y="541" fill="#E2E8F0">Every hop emits telemetry tied</text>
    <text x="1310" y="558" fill="#7C8AA5">to one correlation id</text>
  </g>

  <line x1="1280" y1="586" x2="1535" y2="586" stroke="#2E4468" stroke-width="1"/>
  <text x="1280" y="616" font-size="16" font-weight="700" fill="#FFFFFF">Golden rules</text>

  <g font-size="12.5" fill="#CBD5E1">
    <text x="1280" y="646">— One private database per service;</text>
    <text x="1295" y="663" fill="#7C8AA5">integrate via APIs and events only</text>
    <text x="1280" y="690">— Query synchronously (Feign/REST),</text>
    <text x="1295" y="707" fill="#7C8AA5">command asynchronously (events)</text>
    <text x="1280" y="734">— No distributed ACID — sagas</text>
    <text x="1295" y="751" fill="#7C8AA5">with compensating actions</text>
    <text x="1280" y="778">— Cache is an optimization,</text>
    <text x="1295" y="795" fill="#7C8AA5">never the source of truth</text>
    <text x="1280" y="822">— Deploy, scale &amp; fail each</text>
    <text x="1295" y="839" fill="#7C8AA5">service independently</text>
  </g>

  <!-- footer -->
  <text x="70" y="972" font-size="13" fill="#526079">Technology-agnostic — swap gateway/broker/stores for your stack. The boundaries and the flow are the architecture, not the products.</text>
</svg>
