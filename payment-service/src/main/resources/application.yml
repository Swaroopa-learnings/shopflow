server:
  port: 8085

spring:
  application:
    name: payment-service
  profiles:
    default: dev
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: com.shopflow.common.events

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

app:
  bank:
    # Share of bank calls that fail. 1.0 forces the breaker open, 0.0 never fails.
    failure-rate: 0.3

# Breaker and retry settings, referenced by name from PaymentProcessor.
resilience4j:
  circuitbreaker:
    instances:
      bankGateway:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10             # judge health over the last 10 calls
        minimum-number-of-calls: 5          # need this many before judging
        failure-rate-threshold: 50          # open at 50% failures
        wait-duration-in-open-state: 10s    # stay open this long before retrying
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true     # breaker state appears in /actuator/health
  retry:
    instances:
      bankGateway:
        max-attempts: 3                     # one call plus two retries
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - com.shopflow.payment.client.MockBankClient$BankUnavailableException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,retries
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the database alive for the life of the JVM.
    url: jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/paymentdb
    username: shopflow
    password: shopflow
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: update
