server:
  port: 8080   # the only port external clients use

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      # Each route is a path predicate plus a destination. "lb://name" looks the
      # service up in Eureka and balances across its instances.
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/v1/products/**,/api/v2/products/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
          # Rate limit: 5 requests/second per user, bursting to 10.
          # Requests over the limit get a 429.
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Register as localhost rather than the machine's LAN IP, which changes
    # with the network and would leave stale addresses in the registry.
    hostname: localhost
    prefer-ip-address: false

# Same secret auth-service signs tokens with. Externalize this in real deployments.
app:
  jwt:
    secret: "change-me-shopflow-demo-secret-key-32b!"

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway   # /actuator/gateway/routes lists the live routes

logging:
  level:
    com.shopflow.gateway: INFO
