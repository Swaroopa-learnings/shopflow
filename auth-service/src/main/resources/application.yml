server:
  port: 8081

spring:
  application:
    name: auth-service     # the name registered in Eureka
  profiles:
    # dev = H2 in memory, prod = Postgres. Override with SPRING_PROFILES_ACTIVE.
    default: dev

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    # Stable hostname instead of the machine's LAN IP.
    hostname: localhost
    prefer-ip-address: false

app:
  jwt:
    secret: "change-me-shopflow-demo-secret-key-32b!"   # must match gateway and order-service
    expiry-minutes: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

---
# dev profile: in-memory H2
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # DB_CLOSE_DELAY=-1 keeps the database alive for the life of the JVM.
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop    # use migrations in real deployments
  h2:
    console:
      enabled: true            # /h2-console

---
# prod profile: Postgres
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: shopflow
    password: shopflow
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
