server:
  port: 8082

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/productdb
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis          # @Cacheable writes to Redis rather than an in-process map
    redis:
      key-prefix: "shopflow:products:"   # namespace for keys in a shared Redis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches

logging:
  level:
    com.shopflow.product: DEBUG
