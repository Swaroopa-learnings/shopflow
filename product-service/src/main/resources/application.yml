server:
  port: 8082

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/productdb   # non-relational store
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis          # makes @Cacheable write to Redis (not an in-JVM map)
    redis:
      key-prefix: "shopflow:products:"   # namespacing keys in a shared Redis

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,caches   # /actuator/caches shows cache managers

logging:
  level:
    com.shopflow.product: DEBUG
