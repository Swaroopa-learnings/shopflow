# Backing services for ShopFlow. The Spring applications run separately via mvn.
#
#   docker compose up -d     start Postgres, MongoDB, Redis and Kafka
#   docker compose down -v   stop everything and delete the data volumes
services:

  # Relational database for orders, inventory, payments and users.
  # One instance with a database per service, created by the init script.
  postgres:
    image: postgres:16-alpine
    container_name: shopflow-postgres
    environment:
      POSTGRES_USER: shopflow
      POSTGRES_PASSWORD: shopflow
      POSTGRES_DB: shopflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Inline config instead of a host bind-mount: avoids macOS "operation not
    # permitted" errors when Docker Desktop lacks access to the project folder.
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/init.sql

  # Document database for the product catalog.
  mongodb:
    image: mongo:7
    container_name: shopflow-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  # Redis: product cache, gateway rate-limit counters, and idempotency keys.
  redis:
    image: redis:7-alpine
    container_name: shopflow-redis
    ports:
      - "6379:6379"

  # Kafka in KRaft mode (no ZooKeeper). Carries the saga commands and replies,
  # the order event stream, and notifications.
  kafka:
    image: apache/kafka:3.7.0
    container_name: shopflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so internal topics can't have more than one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

volumes:
  pgdata:
  mongodata:

# Compose copies this file into the container, so no bind mount is needed.
configs:
  postgres-init:
    file: ./deploy/postgres-init.sql
