server:
  port: 8761

spring:
  application:
    name: discovery-server

eureka:
  client:
    # This is the registry itself, so it neither registers nor fetches.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Self-preservation stops Eureka evicting instances when many heartbeats are
    # lost at once. Useful in a cluster, but locally it just keeps dead
    # instances in the registry, so it is off here.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
