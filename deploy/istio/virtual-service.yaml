# Canary release: something Eureka/client-side LB cannot do. 90% of traffic
# goes to the stable v1 pods, 10% to the new v2 pods. Watch error rates, then
# shift weights gradually - or roll back by editing two numbers.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: order-service
  namespace: shopflow
spec:
  hosts:
    - order-service
  http:
    - retries:                 # mesh-level retries: no Java code involved
        attempts: 2
        perTryTimeout: 2s
        retryOn: 5xx,connect-failure
      route:
        - destination:
            host: order-service
            subset: v1
          weight: 90
        - destination:
            host: order-service
            subset: v2
          weight: 10
